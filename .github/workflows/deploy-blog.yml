name: Deploy Blog

on:
  push:
    paths:
      - 'blog/**' # 只有当你修改blog文件夹时才触发，绝不干扰学术主页

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 修正语法错误 node-level -> node-version

      - name: Install and Build Blog
        run: |
          cd blog
          npm install  # 会自动读取你修改后的 package.json，下载所有必需的主题依赖
          npm run build # 会自动读取你定制的 config.ts 进行打包

      - name: Deploy to Subdirectory
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: blog/.vitepress/dist # 打包生成的静态网页路径
          target-folder: blog          # 精准部署到主站的 /blog 子目录下
          branch: gh-pages             # 你的 GitHub Pages 部署分支
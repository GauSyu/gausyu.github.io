name: Deploy Blog

on:
  push:
    branch: [master]
    paths:
      - 'blog/**' # 只有当你修改blog文件夹时才触发

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许同时进行一次部署，跳过正在运行和最新队列之间的运行队列
# 但是，不要取消正在进行的运行，因为我们希望允许这些生产部署完成
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建工作
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 如果未启用 lastUpdated，则不需要
      # - uses: pnpm/action-setup@v4 # 如果使用 pnpm，请取消此区域注释
      #   with:
      #     version: 9
      # - uses: oven-sh/setup-bun@v1 # 如果使用 Bun，请取消注释
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm # 或 pnpm / yarn
          cache-dependency-path: blog/package-lock.json # ⚡ 官方标准：精准告诉缓存去哪里看锁定文件
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci # 或 pnpm install / yarn install / bun install
        working-directory: blog # ⚡ 官方标准：指定此步骤在 blog 文件夹下运行
      - name: Build with VitePress
        run: npm run docs:build # 或 pnpm docs:build / yarn docs:build / bun run docs:build
        working-directory: blog # ⚡ 官方标准：指定打包命令在 blog 文件夹下运行
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog/.vitepress/dist

  # 部署工作
  deploy:
    # ⚡ 删掉或注释掉单独的 environment 块，直接合并到 steps
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4